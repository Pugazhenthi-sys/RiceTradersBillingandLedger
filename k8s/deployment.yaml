apiVersion: v1
kind: Namespace
metadata:
  name: rice-traders
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rice-traders-app
  namespace: rice-traders
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rice-traders-app
  template:
    metadata:
      labels:
        app: rice-traders-app
    spec:
      containers:
        - name: app
          image: DOCKERHUB_REPO_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - name: novnc
              containerPort: 6080
          env:
            - name: SCREEN_WIDTH
              value: "1280"
            - name: SCREEN_HEIGHT
              value: "800"
          readinessProbe:
            tcpSocket:
              port: 6080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6080
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: rice-traders-service
  namespace: rice-traders
spec:
  type: NodePort
  selector:
    app: rice-traders-app
  ports:
    - name: novnc
      port: 6080
      targetPort: 6080
      nodePort: 30080
